# Deploy static content to GitHub Pages.
# Split into build (uploads the "github-pages" artifact) and deploy (consumes
# it) — GitHub's canonical Pages structure. This matters for re-runs: if deploy
# fails on a transient error (e.g. a githubstatus.com hiccup), re-running the
# FAILED job re-runs only `deploy`, so the artifact is never uploaded twice.
# A single-job workflow re-uploads on every re-run, which produces two
# artifacts named "github-pages" in one run and makes deploy-pages fail with
# "Multiple artifacts named 'github-pages' were unexpectedly found".
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build: package the whole repo into the single github-pages artifact.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'

  # Deploy: consume the artifact produced by build. Safe to re-run alone.
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
